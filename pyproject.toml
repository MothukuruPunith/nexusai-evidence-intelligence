[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexusai"
version = "0.2.0"
description = "Evidence-first business intelligence — phased implementation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.2,<2",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers>=5,<6",
  "faiss-cpu>=1.12,<2",
  "numpy>=2,<3",
  "torch>=2.6,<3",
  "huggingface-hub>=2,<3",
]

[dependency-groups]
dev = [
    "httpx2<3",
    "pytest>=8.3,<9",
    "reportlab>=4,<5",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexusai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the dedicated NexusAI PostgreSQL instance", "model: requires the downloaded pinned embedding model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
